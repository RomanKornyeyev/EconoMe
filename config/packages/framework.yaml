# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        gc_maxlifetime: 3600 # 60 min de inactividad sin «Recuérdame»

    #esi: true
    #fragments: true

    rate_limiter:
        change_password:
            policy: 'sliding_window'
            limit: 7
            interval: '3 minutes'
        # Emails de restablecer contraseña, por usuario. Lo comparten
        # «Recuperar contraseña» y el botón del perfil (UserService::requestPasswordReset)
        reset_password_email:
            policy: 'fixed_window'
            limit: 1
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
